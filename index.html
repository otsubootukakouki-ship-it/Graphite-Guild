<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Studio Seathwaite</title>
  <style>
    body {
      background-color: #000000;
      color: #e0e0e0;
      font-family: "Courier New", Courier, monospace;
      padding: 40px 20px;
      max-width: 680px;
      margin: 0 auto;
      line-height: 1.6;
    }
    h1 {
      font-size: 1.4rem;
      letter-spacing: 2px;
      color: #ffffff;
      margin-bottom: 8px;
    }
    .status {
      font-size: 0.85rem;
      color: #888888;
      margin-bottom: 16px;
    }
    .banner-container {
      text-align: center;
      margin: 20px 0 28px 0;
    }
    .banner-img {
      width: 100%;
      max-width: 550px;
      height: auto;
      display: block;
      margin: 0 auto;
      border: none;
    }
    nav {
      margin-bottom: 10px;
    }
    nav a {
      color: #ffffff;
      text-decoration: none;
      margin-right: 8px;
    }
    nav a:hover {
      text-decoration: underline;
    }
    hr {
      border: 0;
      border-top: 1px dashed #333333;
      margin: 24px 0;
    }
    .log-entry {
      margin-bottom: 30px;
    }
    .log-date {
      color: #777777;
      font-size: 0.85rem;
    }
    img {
      max-width: 100%;
      border: 1px solid #222222;
      margin: 12px 0;
    }
  </style>
</head>
<body>
  <h1>「STUDIO SEATHWAITE」</h1>
  <div class="status" id="clock">TIME: LOADING...</div>

  <div class="banner-container">
    <img src="studio_seathwaite_banner_dark.png" alt="Studio Seathwaite Banner" class="banner-img" />
  </div>

  <nav>
    <a href="#overview">overview</a> // 
    <a href="#logs">build logs</a> // 
    <a href="#specs">specs</a>
  </nav>

  <hr />

  <section id="logs">
    <div class="log-entry">
      <div class="log-date">[2026-11-08] - ENTRY 01: PROJECT KICKOFF</div>
      <p>Initiating CAD modeling and mechanism prototyping for the mechanical pencil.</p>
    </div>
  </section>

  <script>
    function updateClock() {
      const now = new Date();
      const options = {
        timeZone: 'America/Monterrey',
        hour: 'numeric',
        minute: '2-digit',
        second: '2-digit',
        hour12: true
      };
      const timeInSPGG = new Intl.DateTimeFormat('en-US', options).format(now);
      document.getElementById('clock').innerText = 'TIME IN SAN PEDRO GARZA GARCÍA, MEXICO - ' + timeInSPGG + ' CST';
    }
    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>
</html>
