<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Studio Seathwaite</title>
  <style>
    body {
      background-color: #000000;
      color: #e0e0e0;
      font-family: "Courier New", Courier, monospace;
      padding: 60px 20px;
      max-width: 720px;
      margin: 0 auto;
      line-height: 1.6;
      text-align: center;
    }
    h1 {
      font-size: 2.2rem;
      letter-spacing: 3px;
      color: #ffffff;
      margin: 0 0 28px 0;
      font-weight: 700;
    }
    .banner-container {
      margin: 0 auto 28px auto;
      max-width: 520px;
    }
    .banner-img {
      width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
      border: none;
    }
    .status {
      font-size: 1.05rem;
      color: #aaaaaa;
      letter-spacing: 0.5px;
      margin-bottom: 24px;
    }
    nav {
      font-size: 1.05rem;
      word-spacing: 2px;
    }
    nav a {
      color: #ffffff;
      text-decoration: none;
      margin: 0 6px;
    }
    nav a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>「STUDIO SEATHWAITE」</h1>

  <div class="banner-container">
    <img src="studio_seathwaite_banner_dark.png" alt="Studio Seathwaite Banner" class="banner-img" />
  </div>

  <div class="status" id="clock">TIME IN SAN PEDRO GARZA GARCÍA, MEXICO - LOADING...</div>

  <nav>
    <a href="about.html">about</a> // 
    <a href="logs.html">build logs</a> // 
    <a href="specs.html">specs</a>
  </nav>

  <script>
    function updateClock() {
      const now = new Date();
      const options = {
        timeZone: 'America/Monterrey',
        hour: 'numeric',
        minute: '2-digit',
        second: '2-digit',
        hour12: true
      };
      const timeInSPGG = new Intl.DateTimeFormat('en-US', options).format(now);
      document.getElementById('clock').innerText = 'TIME IN SAN PEDRO GARZA GARCÍA, MEXICO - ' + timeInSPGG + ' CST';
    }
    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>
</html>
