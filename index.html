<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Graphite Guild</title>
  <style>
    body {
      background-color: #000000;
      color: #e0e0e0;
      font-family: "Courier New", Courier, monospace;
      padding: 40px 20px;
      max-width: 680px;
      margin: 0 auto;
      line-height: 1.6;
    }
    h1 {
      font-size: 1.4rem;
      letter-spacing: 2px;
      color: #ffffff;
      margin-bottom: 8px;
    }
    .status {
      font-size: 0.85rem;
      color: #888888;
      margin-bottom: 24px;
    }
    nav a {
      color: #ffffff;
      text-decoration: none;
      margin-right: 8px;
    }
    nav a:hover {
      text-decoration: underline;
    }
    hr {
      border: 0;
      border-top: 1px dashed #333333;
      margin: 24px 0;
    }
    .log-entry {
      margin-bottom: 30px;
    }
    .log-date {
      color: #777777;
      font-size: 0.85rem;
    }
    img {
      max-width: 100%;
      border: 1px solid #222222;
      margin: 12px 0;
    }
  </style>
</head>
<body>
  <h1>「GRAPHITE GUILD」</h1>
  <div class="status" id="clock">TIME: LOADING...</div>

  <nav>
    <a href="#overview">overview</a> // 
    <a href="#logs">build logs</a> // 
    <a href="#specs">specs</a>
  </nav>

  <hr />

  <section id="logs">
    <div class="log-entry">
      <div class="log-date">[2026-11-08] - ENTRY 01: PROJECT KICKOFF</div>
      <p>Initiating CAD modeling and mechanism prototyping for the mechanical pencil.</p>
    </div>
  </section>

  <script>
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').innerText = 'LOCAL TIME - ' + now.toLocaleTimeString();
    }
    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>
</html>
